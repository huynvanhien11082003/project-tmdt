spring.application.name=demotmdt

# 1. Cấu hình kết nối (Có luôn giá trị mặc định dự phòng nối thẳng vào 'db')
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/techstore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. KHẮC PHỤC LỖI DIALECT: Ép buộc Spring Boot hiểu đây là MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Các cấu hình Hibernate khác
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.address=0.0.0.0